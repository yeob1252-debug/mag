<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>맛집감별사 히어로 V6 미리보기</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="css/hero-v6-preview.css?v=20260901-v6">
</head>
<body>
  <a class="v6-skip" href="#preview-handoff">히어로 미리보기 건너뛰기</a>

  <header class="v6-header" aria-label="맛집감별사 미리보기 머리말">
    <a class="v6-brand" href="#hero-preview" aria-label="맛집감별사 히어로 처음으로">맛집감별사</a>
    <span class="v6-scene-count" aria-live="polite"><b>1</b><i></i><em>6</em></span>
  </header>

  <main>
    <section class="v6-story" id="hero-preview" data-state="0" data-screen="none" aria-label="맛집감별사 히어로 장면 미리보기">
      <div class="v6-scene">
        <div class="v6-field v6-field--ink" aria-hidden="true"></div>
        <div class="v6-field v6-field--warm" aria-hidden="true"></div>
        <div class="v6-mask" aria-hidden="true"></div>

        <div class="v6-copy" aria-live="polite">
          <h1>맛집채널의 첫 영상은 하루 안에.<br>대구 매장 광고는<br class="v6-wide-break"> <span class="v6-wide-nowrap">맞는 크리에이터와.</span></h1>
          <p>대구에서 하루 실습으로 첫 업로드까지 교육하고, 매장에는 <span class="v6-nowrap">예산·성향</span>에 맞는 크리에이터와 촬영·업로드 협의를 연결합니다.</p>
        </div>

        <div class="v6-phone" aria-label="맛집채널 첫 업로드와 음식점 크리에이터 연결 장면">
          <div class="v6-phone-frame">
            <span class="v6-island" aria-hidden="true"></span>
            <div class="v6-phone-screen">
              <section class="v6-screen v6-screen--creator" aria-label="맛집채널 첫 영상 업로드">
                <img src="assets/generated/matgamsa-category-korean.webp" alt="연출 이미지: 자연광의 따뜻한 한식 상차림">
                <span class="v6-play" aria-hidden="true"></span>
                <span class="v6-upload" aria-hidden="true"><i></i></span>
                <small>연출 이미지</small>
              </section>
              <section class="v6-screen v6-screen--owner" aria-label="매장과 크리에이터 연결 및 촬영 업로드 협의">
                <div class="v6-store-mark" aria-hidden="true"><i></i></div>
                <div class="v6-match-line" aria-hidden="true"><i></i></div>
                <div class="v6-creator-mark" aria-hidden="true"><i></i></div>
                <div class="v6-agreement" aria-hidden="true"><i></i><i></i><i></i></div>
              </section>
            </div>
          </div>
        </div>

        <nav class="v6-routes" aria-label="대상별 다음 경로">
          <a href="#preview-handoff">맛집채널 시작 과정 보기 <span aria-hidden="true">↗</span></a>
          <a href="#preview-handoff">매장 연결 방식 보기 <span aria-hidden="true">↗</span></a>
        </nav>

        <div class="v6-progress" aria-hidden="true"><i></i></div>
      </div>
    </section>

    <section class="v6-handoff" id="preview-handoff" aria-label="히어로 이후 중립 인계 화면">
      <i aria-hidden="true"></i>
    </section>
  </main>

  <script src="js/hero-v6-preview.js?v=20260901-v6" defer></script>
</body>
</html>
